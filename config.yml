# How far back each adapter looks on every poll. Generous overlap is
# cheap because de-duplication happens on document URL.
lookback_days: 60

# Window described in the digest header.
digest_days: 14

# 0 = Monday. The digest fires on this weekday during a tick, and only
# if there is something new to report.
digest_weekday: 4

schedule:
  # Your hardcoded government meeting schedule, the same one the website
  # widgets read. Government meetings are not in Mobilize, you found that
  # while building the widget, so this file is the authority. Point this
  # at whatever URL serves the array.
  #
  # This is the tcdp-events-api repo's public/ folder, which netlify.toml
  # publishes at the site root. The same file the Squarespace widgets
  # load, so there is one calendar, not two. The array is called
  # TCDP.GOV_MEETINGS in it, which array_names below already covers.
  shared_js_url: https://tcdp-events-api.netlify.app/tcdp-shared.js

  # Variable names to look for inside that file.
  array_names:
    - govMeetings
    - governmentMeetings
    - GOV_MEETINGS

  # Supplement only. Occasionally a meeting gets staged as a Mobilize
  # event, and catching that costs one request per org.
  mobilize_org_ids:
    - 1550     # TCDP


# Terms the extractor flags. These drive the between-digest alerts, so
# keep the list to things you would actually want to be interrupted for.
watchlist:
  - landfill
  - solid waste
  - leachate
  - DEQ
  - Department of Environmental Quality
  - transfer station
  - parcel fee
  - availability fee
  - social services
  - DSS
  - staffing contract
  - school bond
  - Joint School Bond Project Committee
  - vestibule
  - capital improvement plan
  - courthouse
  - tax rate
  - revenue neutral
  - fund balance
  - SNAP
  - teacher supplement
  - average daily membership
  - public comment
  - decorum
  - closed session
  - open meetings
  - public records
  - agenda modification
  - stormwater
  - steep slope
  - homelessness
  - affordable housing
  - rezoning
  - conditional use

# Structural gaps that are true every cycle. The synthesis prompt folds
# these into the Gaps section so the brief never reads as complete when
# it is not.
known_gaps:
  - County minutes are approved four to six weeks after the meeting, so
    the most recent county meeting is usually represented by its agenda
    only, with no record of how anything was actually voted.
  # Folded block scalar, not a plain one. This entry contains colons and
  # a plain scalar in a list would be read as a mapping and break the
  # parse. Use >- for any gap text carrying a colon.
  - >-
    Where a county item rests on the meeting recording rather than on
    approved minutes, the underlying text is Vimeo's auto-generated
    captions. Speech recognition mangles proper nouns and figures, and
    no human has corrected them. Treat names, dollar amounts and vote
    counts from a county transcript as unconfirmed, and say so in the
    sentence. The same applies to city and school board video, which
    comes from YouTube auto-captions.
    This is still far better than the alternative it replaced. Approved
    county minutes lag four to six weeks and compress an entire public
    comment period into a line or two, so for the current meeting the
    recording is the only account of who spoke and what they said.
  - School board agendas post roughly a week ahead. Minutes appear in
    the following month's consent agenda, not as standalone documents.
  - >-
    Brevard council minutes are mostly published as scans of the signed
    copy, with no text layer that any tool can read without OCR.
    Measured 2026-08-23 over the five most recent sets: one readable,
    2026-07-20, and four scanned. So a city meeting is usually
    represented here by its agenda packet and its recording, and the
    approved minutes that would confirm how a vote actually went are
    present on the city's site but unreadable to this pipeline. Where a
    city vote count or figure appears in this brief and no city minutes
    record is cited, it comes from the recording's auto-generated
    captions and is unconfirmed.
  - >-
    Board of Elections coverage is close to nil, and the cause is the
    source rather than the pipeline. The board publishes no agendas and
    no recordings, so its minutes are the only account of any of its
    meetings that will ever exist, and 93 percent of those minutes are
    scanned images of paper with no extractable text. Measured
    2026-08-06 over the sixteen most recent sets: one readable, fourteen
    scanned, one linking a file that 404s. Assume any elections meeting
    is unreported here unless a record for it says otherwise. This would
    be fixed by OCR, which is not installed.

alerts:
  enabled: true

email:
  enabled: true
  # Recipients of the brief. This is separate from GMAIL_USER, which is
  # the sending account and lives in the repository secrets.
  to:
    - chair@transcodems.com

video:
  enabled: true

  # Videos are large and slow. Keep this window tight and let the daily
  # document poll do the broad watching.
  #
  # Back to 21 now the 2026-08-06 backfill is done, six transcripts and
  # all six extracted. This is a safety net, not the primary mechanism:
  # the T+1 to T+4 video window is what catches a meeting in normal
  # operation, and this only decides how far back a windowless run like
  # `transcribe` will reach.
  #
  # Widen it temporarily, not permanently, if a body's video needs
  # sweeping up after an outage.
  #
  # 45, not 21, and this is the settling the note here used to defer. The
  # school board meets monthly, so consecutive meetings are 28 to 35 days
  # apart. 21 is shorter than that gap, which means a windowless sweep
  # run once per meeting cycle can land in a hole where the last meeting
  # has already aged out and the next has not happened. 45 leaves a
  # fortnight of slack either side. The T+1 to T+4 window is still what
  # catches a meeting in normal operation and is unaffected by this.
  #
  # It costs nothing per extra day. Discovery is one RSS request either
  # way, max_per_run still caps the work, and anything already in
  # state/video is reused rather than fetched again.
  lookback_days: 45

  # Hard ceiling per run so one bad discovery cannot burn an hour of CI
  # on a backlog you did not ask for.
  max_per_run: 4

  # base.en is about four to eight times realtime on a CPU runner.
  # small.en is better on crosstalk and room echo at roughly half the
  # speed. Only YouTube-less sources hit Whisper at all.
  whisper_model: base.en

  # County meeting video. The county streams to its own Vimeo account and
  # links each recording from its meetings index, so discovery rides on
  # the same County.rows() the document adapter reads.
  #
  # Captions are auto-generated by Vimeo and fetched from the player
  # config endpoint. yt-dlp is not involved and is not required: Vimeo
  # withdrew anonymous extraction and yt-dlp now demands a login, while
  # the player config endpoint still answers anonymously.
  vimeo:
    enabled: true

  granicus:
    # Off. Probed 2026-08-05: the legacy RSS views carry only leftover
    # 2022 training clips and the legacy API paths return 404. The county
    # is on the newer boards interface, whose HTML robots.txt disallows.
    # Superseded by the vimeo adapter above. Left in place rather than
    # deleted in case another body ever turns up on legacy Granicus.
    enabled: false
    view_id:

  youtube:
    - body: schools
      channel: https://www.youtube.com/user/tcsnc
      # The channel feed updates within minutes of an upload, which is as
      # close to a push notification as YouTube offers. Legacy /user/
      # channels accept ?user=; newer ones need ?channel_id=UC...
      # Resolve once with:
      #   yt-dlp --print channel_id https://www.youtube.com/user/tcsnc
      # Resolved from /user/tcsnc on 2026-08-05. The legacy ?user= form
      # still answers, but it is the deprecated one, so pin the id.
      rss_url: https://www.youtube.com/feeds/videos.xml?channel_id=UCblwE2_OLBGrrioIV0Esfyw
      # Loose on purpose and checked against the live feed: across 15
      # entries heavy with graduations and student features, this matched
      # only "TCS Board Meeting 06-15-2026". Narrowing it to "board
      # meeting" would break the moment they title one "Board of
      # Education Meeting".
      title_filter: "board|meeting"
    - body: city
      channel: https://www.youtube.com/channel/UCQLjYNExYc71BKYghN0V5iA
      # The city's own City Council meetings playlist, not the channel
      # feed. The city curates this, so the filtering happens upstream
      # and we inherit it.
      #
      # That matters here. The channel posts three videos per meeting: an
      # agenda preview before, the meeting, and a staff recap after. Off
      # the channel feed a plain "city council" match took all three,
      # which is a correctness problem before it is a cost one, since a
      # staff recap filed in transcripts/ with frontmatter naming a body
      # and a meeting date reads as the proceedings. The playlist carries
      # meetings only: 15 entries checked on 2026-08-05, zero previews,
      # zero recaps.
      #
      # Note the feed is ordered by playlist position, not by date, so
      # never assume entry order is chronological. The lookback cutoff in
      # video.py filters before max_per_run slices, which is what keeps
      # that safe.
      rss_url: https://www.youtube.com/feeds/videos.xml?playlist_id=PLjGP_ZHg4MS1BBWaYNGN1x4RtrERCAPB3
      # Belt and braces behind the playlist, in case a preview ever gets
      # added to it by mistake. Matches all 15 current entries.
      title_filter: "^(?!.*(preview|recap|meet the mayor)).*city council"

  # Used only to correct names that speech recognition mangles. The
  # attributor may map a near miss onto a roster spelling. It may never
  # assign a name the transcript did not say.
  roster:
    - Teresa McCall, Chair, Board of Commissioners
    - Larry Chapman, Vice Chair, Board of Commissioners
    - Jason Chappell, Commissioner
    - Jake Dalton, Commissioner
    - Chase McKelvey, Commissioner
    - Jaime Laughter, County Manager
    - Trisha Hogan, Clerk to the Board
    - Lisa Fletcher, Superintendent, Transylvania County Schools
    - Brian Weaver, Assistant Superintendent
    - Michelle Mullinax, Finance Director, Transylvania County Schools
    - Beecher Allison, Joint School Bond Project Manager
    - Wilson Hooper, Brevard City Manager
    - Christy Wentzell, Brevard Police Chief
    # Not an official. Listed because the roster's job is to correct
    # names speech recognition mangles, and this one was coming back as
    # both "Peter Offen" and "Peter Often" across two meetings in the
    # same extraction batch.
    - Peter Offen, frequent public comment speaker
